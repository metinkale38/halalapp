name: Deploy to Test

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull-Request-Nummer
        required: true
        type: number

concurrency:
  group: deploy-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-test:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'deploy-test'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Download Artifact from PR Build
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          pr: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          name: server-jar
          workflow_conclusion: success
          check_artifacts: true

      - name: Deploy to Test Server
        env:
          HMAC_SECRET: ${{ secrets.DEPLOY_SECRET_TEST }}
          SERVER_URL: ${{ secrets.DEPLOY_URL_TEST }}
        run: |
          SIGNATURE=$(openssl dgst -sha256 -hmac "$HMAC_SECRET" -binary server-all.jar | base64)
          curl --fail -X POST "$SERVER_URL/deploy" -H "X-Signature: $SIGNATURE" --data-binary @server-all.jar
