name: Deploy to Test

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull-Request-Nummer
        required: true
        type: number

concurrency:
  group: deploy-test-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  deploy-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-test')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Resolve pull request and wait for build
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail

          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)

          for attempt in $(seq 1 120); do
            run=$(gh run list \
              --repo "$REPO" \
              --workflow build.yml \
              --event pull_request \
              --limit 100 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$head_sha\") | [.databaseId, .status, .conclusion] | @tsv" \
              | head -n1)

            if [ -n "$run" ]; then
              run_id=$(echo "$run" | cut -f1)
              status=$(echo "$run" | cut -f2)
              conclusion=$(echo "$run" | cut -f3)

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "Build $run_id completed with conclusion '$conclusion'" >&2
                exit 1
              fi
            fi

            sleep 10
          done

          echo "Timed out waiting for the pull request build" >&2
          exit 1

      - name: Download Artifact from PR Build
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ steps.build.outputs.run_id }}
          name: server-jar
          check_artifacts: true

      - name: Deploy to Test Server
        env:
          HMAC_SECRET: ${{ secrets.DEPLOY_SECRET_TEST }}
          SERVER_URL: ${{ secrets.DEPLOY_URL_TEST }}
        run: |
          SIGNATURE=$(openssl dgst -sha256 -hmac "$HMAC_SECRET" -binary server-all.jar | base64)
          curl --fail -X POST "$SERVER_URL/deploy" -H "X-Signature: $SIGNATURE" --data-binary @server-all.jar
