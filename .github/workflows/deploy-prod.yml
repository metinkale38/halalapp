name: Deploy to Prod

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Artifact from Main Build
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: server-jar

      - name: Download Artifact from Latest Main Build
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          branch: main
          name: server-jar
          workflow_conclusion: success

      - name: Deploy to Prod Server
        env:
          HMAC_SECRET: ${{ secrets.DEPLOY_SECRET_PROD }}
          SERVER_URL: ${{ secrets.DEPLOY_URL_PROD }}
        run: |
          SIGNATURE=$(openssl dgst -sha256 -hmac "$HMAC_SECRET" -binary server-all.jar | base64)
          curl --fail -X POST "$SERVER_URL/deploy" -H "X-Signature: $SIGNATURE" --data-binary @server-all.jar
